name: ci

on:
  push:
    branches:
      - main
  # No branch filter: the lint wave stacks its pull requests on top of each
  # other, and filtering on `main` left every intermediate step ungated -- only
  # the secret scanner ran.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COREPACK_DEFAULT_TO_LATEST: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the version of record. oxlint needs at least 22.18 to
          # read a TypeScript config, which every value there clears.
          node-version-file: .nvmrc
      # Node's bundled corepack predates the pnpm version pinned in
      # packageManager. Pinned so a corepack release cannot break every
      # build at once.
      - run: npm i -g --force corepack@0.34.0 && corepack enable
      # The sidecar is a sub-project with its own manifest, and `pnpm test`
      # runs its suite.
      - run:
          pnpm install --frozen-lockfile && cd frontend-vue && pnpm install --frozen-lockfile && cd ../sidecar &&
          pnpm install && cd chatbox && pnpm install --frozen-lockfile
      - run: pnpm lint
      # tsconfig.json is the config the editors and oxlint's type-aware pass
      # read; tsconfig.build.json is the one the build uses. Without this the
      # first is never exercised, and a resolution failure there degrades every
      # type-aware rule to `any` without failing anything.
      - run: pnpm exec tsc -p tsconfig.json
      # Unused dependencies only. `pnpm knip:all` also reports dead files and
      # exports, which need a human to confirm, so they stay out of the gate.
      - run: pnpm knip
      - run: cd sidecar && pnpm knip
      - run: pnpm build
      - run: pnpm test:frontend-registration
      - run: pnpm test:release-script
      - run: pnpm test
      - run: pnpm --dir sidecar typecheck
