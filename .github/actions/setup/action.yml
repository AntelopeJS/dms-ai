name: setup
description: Node, pnpm and the installs of the projects a CI job needs.

inputs:
  frontend:
    description: Also install frontend-vue, a project with its own lockfile.
    default: "false"
  sidecar:
    description: Also install the sidecar, a project with its own lockfile.
    default: "false"

runs:
  using: composite
  steps:
    # Installs the pnpm version pinned in the root `packageManager`, and puts
    # it on PATH before setup-node, which needs it to read the pnpm store.
    # Root installs use that version for every workspace member.
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

    - uses: actions/setup-node@v4
      with:
        # .nvmrc is the version of record. oxlint needs at least 22.18 to
        # read a TypeScript config, which every value there clears.
        node-version-file: .nvmrc
        # One store for the three projects, so the key covers every lockfile.
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          frontend-vue/pnpm-lock.yaml
          sidecar/pnpm-lock.yaml

    - run: |
        filters=(--filter "{.}")
        if [ "$INSTALL_FRONTEND" = true ]; then
          filters+=(--filter @antelopejs/dms-ai-frontend-vue)
        fi
        if [ "$INSTALL_SIDECAR" = true ]; then
          filters+=(--filter @antelopejs/dms-ai-sidecar)
        fi
        pnpm install "${filters[@]}" --frozen-lockfile
      shell: bash
      env:
        INSTALL_FRONTEND: ${{ inputs.frontend }}
        INSTALL_SIDECAR: ${{ inputs.sidecar }}
